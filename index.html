<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Clock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../css/all.min.css">
</head>
<body>
    <div class="PomodoroClock-container">
        <h1>Pomodoro Clock⏱️</h1>

        <div class="container">

            <div class="time-display">25:00</div>

            <div class="controls">
                <button id="inc-btn" class="btn">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button id="dec-btn" class="btn">
                    <i class="fa-solid fa-minus"></i>
                </button>
            </div>

        </div>

        <div class="buttons">
            <button id="start-btn">Start
                <i class="fa-solid fa-play play"></i>
                <i class="fa-solid fa-pause pause"></i>
            </button>
            <button id="stop-btn">Stop
                <i class="fa-solid fa-square"></i>
            </button>
            <button id="reset-btn">Reset</button>
        </div>
    </div>
    
   <script src="script.js"></script>
    
</body>
</html>
